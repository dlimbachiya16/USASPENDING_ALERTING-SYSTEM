name: USASpending Awards Alert

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-awards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run awards checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_awards.py

      - name: Commit updated seen_awards.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_awards.json
          git diff --cached --quiet || git commit -m "Update seen awards [skip ci]"
          git push
